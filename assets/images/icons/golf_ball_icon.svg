    <circle cx="6.5" cy="12" r="0.85"/>
    <circle cx="17.5" cy="12" r="0.85"/>
    <circle cx="12" cy="5.8" r="0.85"/>
    <circle cx="12" cy="17.8" r="0.85"/>
    <circle cx="7.8" cy="8" r="0.8"/>
