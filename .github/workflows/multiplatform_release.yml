name: Multiplatform Build & Release

on:
  workflow_dispatch:
    inputs:
      skip_windows:
        description: 'Skip Windows build (reuse previous artifact)'
        required: false
        type: boolean
        default: false
      skip_macos:
        description: 'Skip macOS build (reuse previous artifact)'
        required: false
        type: boolean
        default: false
      skip_ios:
        description: 'Skip iOS build (reuse previous artifact)'
        required: false
        type: boolean
        default: false
      skip_android:
        description: 'Skip Android build (reuse previous artifact)'
        required: false
        type: boolean
        default: false
      skip_builds:
        description: 'Skip ALL platform builds (reuse all previous artifacts for publish/deploy only)'
        required: false
        type: boolean
        default: false
      from_run_id:
        description: 'Run ID(s) to download artifacts from for skipped platforms (can be comma-separated, e.g. 41540098265, 41532486348)'
        required: false
        default: ''
      release_tag:
        description: 'Release Tag (leave empty to use current project.godot version, e.g. v0.164.1)'
        required: false
        default: ''
      deploy_play_store:
        description: 'Deploy Android AAB to Google Play tracks (draft status)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: multiplatform-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. BUILD WINDOWS DESKTOP
  # =========================================================================
  build-windows:
    name: Build Windows Desktop
    if: ${{ !inputs.skip_builds && !inputs.skip_windows }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache Godot & Export Templates
        id: cache-godot-windows
        uses: actions/cache@v4
        with:
          path: |
            ~\Godot
            ~\AppData\Roaming\Godot\export_templates
          key: godot-4.7-mono-windows-v1

      - name: Download Godot 4.7 Mono & Windows Templates
        if: steps.cache-godot-windows.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$HOME\Godot" -Force | Out-Null
          New-Item -ItemType Directory -Path "$HOME\AppData\Roaming\Godot\export_templates\4.7.stable.mono" -Force | Out-Null

          # Download Godot Mono Editor for Windows
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_mono_win64.zip" -OutFile "$HOME\Godot\godot.zip"
          Expand-Archive -Path "$HOME\Godot\godot.zip" -DestinationPath "$HOME\Godot\bin" -Force

          # Download Export Templates
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_mono_export_templates.tpz" -OutFile "$HOME\Godot\templates.zip"
          Expand-Archive -Path "$HOME\Godot\templates.zip" -DestinationPath "$HOME\Godot\templates_extracted" -Force
          Copy-Item -Path "$HOME\Godot\templates_extracted\templates\*" -Destination "$HOME\AppData\Roaming\Godot\export_templates\4.7.stable.mono" -Recurse -Force
          Remove-Item "$HOME\Godot\templates.zip", "$HOME\Godot\templates_extracted" -Recurse -Force

      - name: Locate Godot Executable
        shell: pwsh
        run: |
          $godotExe = (Get-ChildItem -Path "$HOME\Godot" -Filter "*console.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $godotExe) {
            $godotExe = (Get-ChildItem -Path "$HOME\Godot" -Filter "Godot*.exe" -Recurse | Select-Object -First 1).FullName
          }
          Write-Host "GODOT_BIN=$godotExe"
          Add-Content -Path $env:GITHUB_ENV -Value "GODOT_BIN=$godotExe"

          # Configure Godot Editor Settings to prevent teardown warnings / ADB shutdown hangs
          New-Item -ItemType Directory -Path "$HOME\AppData\Roaming\Godot" -Force | Out-Null
          $content = "[godot_resource type=`"EditorSettings`" format=3]`n`n[resource]`nexport/android/shutdown_adb_on_exit = false`n"
          @("editor_settings-4.tres", "editor_settings-4.7.tres") | ForEach-Object {
            $settingsPath = "$HOME\AppData\Roaming\Godot\$_"
            if (-not (Test-Path $settingsPath)) {
              Set-Content -Path $settingsPath -Value $content -Encoding UTF8
            }
          }

      - name: Build Windows Release Package
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File .\scripts\build\build_windows.ps1 -CustomGodotPath "$env:GODOT_BIN" -Clean
          Get-Process -Name Godot*, VBCSCompiler -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeckleGolfSim-Windows
          path: dist/HeckleGolfSim-Windows-*.zip

  # =========================================================================
  # 2. BUILD MACOS
  # =========================================================================
  build-macos:
    name: Build macOS Universal
    if: ${{ !inputs.skip_builds && !inputs.skip_macos }}
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache Godot & Export Templates
        id: cache-godot-macos
        uses: actions/cache@v4
        with:
          path: |
            ~/Godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-4.7-mono-macos-universal-v1

      - name: Download Godot 4.7 Mono & Templates
        if: steps.cache-godot-macos.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/Godot
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.stable.mono"

          curl -L -o ~/Godot/godot_mono.zip "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_mono_macos.universal.zip"
          unzip -q ~/Godot/godot_mono.zip -d ~/Godot/

          curl -L -o ~/Godot/templates.tpz "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_mono_export_templates.tpz"
          unzip -q ~/Godot/templates.tpz -d ~/Godot/templates_extracted
          cp -r ~/Godot/templates_extracted/templates/* "$HOME/Library/Application Support/Godot/export_templates/4.7.stable.mono/"
          rm -rf ~/Godot/templates_extracted ~/Godot/templates.tpz

      - name: Locate Godot Executable
        run: |
          GODOT_BIN=$(find ~/Godot -name "Godot" -type f | head -n 1)
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> $GITHUB_ENV

      - name: Build macOS Release Package
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File ./scripts/build/build_mac.ps1 -CustomGodotPath "$env:GODOT_BIN" -Clean
          Get-Process -Name Godot*, VBCSCompiler -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeckleGolfSim-macOS
          path: dist/HeckleGolfSim-macOS-*.zip

  # =========================================================================
  # 3. BUILD IOS (IPA)
  # =========================================================================
  build-ios:
    name: Build iOS Package
    if: ${{ !inputs.skip_builds && !inputs.skip_ios }}
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache Godot & Export Templates
        id: cache-godot-ios
        uses: actions/cache@v4
        with:
          path: |
            ~/Godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-4.7-mono-macos-universal-v1

      - name: Download Godot 4.7 Mono & Templates
        if: steps.cache-godot-ios.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/Godot
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.stable.mono"

          curl -L -o ~/Godot/godot_mono.zip "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_mono_macos.universal.zip"
          unzip -q ~/Godot/godot_mono.zip -d ~/Godot/

          curl -L -o ~/Godot/templates.tpz "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_mono_export_templates.tpz"
          unzip -q ~/Godot/templates.tpz -d ~/Godot/templates_extracted
          cp -r ~/Godot/templates_extracted/templates/* "$HOME/Library/Application Support/Godot/export_templates/4.7.stable.mono/"
          rm -rf ~/Godot/templates_extracted ~/Godot/templates.tpz

      - name: Locate Godot Executable
        run: |
          GODOT_BIN=$(find ~/Godot -name "Godot" -type f | head -n 1)
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> $GITHUB_ENV

      - name: Build C# Solution
        run: dotnet build HeckleGolfSim.csproj -c Release

      - name: Restore Bundled Cached Course Geometries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Restoring cached geometry files from release assets..."
          if [ ! -d "Courses/CachedGeometry" ] || [ $(find Courses/CachedGeometry -name "*.json.gz" 2>/dev/null | wc -l) -lt 100 ]; then
            gh release download course-cache --pattern "cached_geometry.tar" --clobber || gh release download v0.142.4 --pattern "cached_geometry.tar" --clobber || true
            if [ -f "cached_geometry.tar" ]; then
              echo "Extracting cached_geometry.tar..."
              tar -xf cached_geometry.tar
              rm -f cached_geometry.tar
              echo "Cached geometry files restored: $(find Courses/CachedGeometry -name '*.json.gz' | wc -l)"
            else
              echo "Warning: cached_geometry.tar could not be downloaded."
            fi
          else
            echo "Courses/CachedGeometry already populated."
          fi

      - name: Export iOS Preset via Godot
        run: |
          mkdir -p ios_export
          mkdir -p dist
          "$GODOT_BIN" --headless --import || true
          "$GODOT_BIN" --headless --export-release "iOS" ios_export/HeckleGolfSim.ipa

      - name: Build and Package Unsigned .ipa
        run: |
          XCODEPROJ=$(find ios_export -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          if [ -z "$XCODEPROJ" ]; then
            XCODEPROJ=$(find . -name "*.xcodeproj" -not -path "*/build_output/*" | head -n 1)
          fi
          if [ -z "$XCODEPROJ" ]; then
            echo "ERROR: Could not find any .xcodeproj directory!"
            ls -la ios_export/
            exit 1
          fi
          echo "Found Xcode project at: $XCODEPROJ"

          if [ -f "$XCODEPROJ/project.pbxproj" ]; then
            sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$XCODEPROJ/project.pbxproj" || true
            sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' "$XCODEPROJ/project.pbxproj" || true
            sed -i '' 's/CODE_SIGN_IDENTITY = ".*";/CODE_SIGN_IDENTITY = "";/g' "$XCODEPROJ/project.pbxproj" || true
          fi

          find ios_export -name "*-Info.plist" -o -name "Info.plist" | while read -r plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $VERSION" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string Heckle Golf Simulator requires Bluetooth to connect to launch monitors like the Square Golf Launch Monitor." "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSBluetoothAlwaysUsageDescription Heckle Golf Simulator requires Bluetooth to connect to launch monitors like the Square Golf Launch Monitor." "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string Heckle Golf Simulator requires Bluetooth to connect to launch monitors like the Square Golf Launch Monitor." "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSBluetoothPeripheralUsageDescription Heckle Golf Simulator requires Bluetooth to connect to launch monitors like the Square Golf Launch Monitor." "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled bool true" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace bool true" "$plist" 2>/dev/null || true
          done

          SCHEME_NAME=$(xcodebuild -list -project "$XCODEPROJ" | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | head -n 1 | xargs)
          if [ -z "$SCHEME_NAME" ]; then
            SCHEME_NAME="Heckle Golf"
          fi

          mkdir -p build_output/Payload
          xcodebuild -project "$XCODEPROJ" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_output/derived \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            OTHER_LDFLAGS='$(inherited) -framework CoreBluetooth' \
            build

          APP_DIR=$(find build_output/derived -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: .app directory not found in build_output/derived"
            exit 1
          fi

          cp -r "$APP_DIR" build_output/Payload/
          cd build_output
          zip -qr ../dist/HeckleGolfSim.ipa Payload
          cd ..

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeckleGolfSim-iOS
          path: dist/HeckleGolfSim.ipa

  # =========================================================================
  # 4. BUILD & SIGN ANDROID AAB
  # =========================================================================
  build-android:
    name: Build & Sign Android AAB
    if: ${{ !inputs.skip_builds && !inputs.skip_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache Godot & Export Templates
        id: cache-godot-linux
        uses: actions/cache@v4
        with:
          path: |
            ~/Godot
            ~/.local/share/godot/export_templates
          key: godot-4.7-mono-linux-v1

      - name: Download Godot 4.7 Mono & Linux/Android Templates
        if: steps.cache-godot-linux.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/Godot
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable.mono

          curl -L -o ~/Godot/godot.zip "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_mono_linux_x86_64.zip"
          unzip -q ~/Godot/godot.zip -d ~/Godot/

          curl -L -o ~/Godot/templates.tpz "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_mono_export_templates.tpz"
          unzip -q ~/Godot/templates.tpz -d ~/Godot/templates_extracted
          cp -r ~/Godot/templates_extracted/templates/* ~/.local/share/godot/export_templates/4.7.stable.mono/
          rm -rf ~/Godot/templates_extracted ~/Godot/templates.tpz

      - name: Locate Godot Executable
        run: |
          GODOT_BIN=$(find ~/Godot -name "Godot*linux*x86_64" -type f | head -n 1)
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> $GITHUB_ENV

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          if [ ! -s release.keystore ]; then
            echo "ERROR: release.keystore is empty. Check ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi

      - name: Configure Godot Editor Settings
        run: |
          mkdir -p "$HOME/.config/godot"
          printf '[godot_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/shutdown_adb_on_exit = false\n' "${ANDROID_HOME:-/usr/local/lib/android/sdk}" "${JAVA_HOME}" > "$HOME/.config/godot/editor_settings-4.tres"
          cp "$HOME/.config/godot/editor_settings-4.tres" "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Ensure Android Build Template & Directories
        run: |
          mkdir -p dist
          # Extract android template gradle files from export templates without clobbering git-tracked custom files
          TEMPLATE_ZIP="$HOME/.local/share/godot/export_templates/4.7.stable.mono/android_source.zip"
          if [ -f "$TEMPLATE_ZIP" ]; then
            mkdir -p android/build
            unzip -n -q "$TEMPLATE_ZIP" -d android/build || true
          fi
          # Ensure custom git-tracked config.gradle is preserved
          git checkout -- android/build/config.gradle 2>/dev/null || true
          mkdir -p android/build/assetPackInstallTime/src/main/assets
          rm -f android/build/src/main/assets/_cl_
          chmod +x android/build/gradlew

      - name: Precompile C# Solution for Android
        run: |
          dotnet build HeckleGolfSim.csproj -c ExportRelease -p:GodotTargetPlatform=android -p:UseSharedCompilation=false -nr:false

      - name: Read Version Metadata
        id: meta
        run: |
          VERSION_NAME=$(grep 'config/version=' project.godot | cut -d'"' -f2)
          VERSION_CODE=$(grep 'version/code=' export_presets.cfg | head -n 1 | cut -d'=' -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Building Version: $VERSION_NAME (Code: $VERSION_CODE)"

      - name: Export Android Project & Build AAB
        run: |
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m"
          "$GODOT_BIN" --headless --import || true
          "$GODOT_BIN" --headless --export-release "Android" dist/HeckleGolfSim.aab || true

          if [ ! -f "dist/HeckleGolfSim.aab" ]; then
            if [ -f "HeckleGolfSim.aab" ]; then
              cp HeckleGolfSim.aab dist/HeckleGolfSim.aab
            elif [ -f "../HeckleGolfSim.aab" ]; then
              cp ../HeckleGolfSim.aab dist/HeckleGolfSim.aab
            else
              AAB_BUILD=$(find android/build -name "*.aab" | head -n 1)
              if [ -n "$AAB_BUILD" ]; then
                echo "Found generated AAB at: $AAB_BUILD, copying to dist/HeckleGolfSim.aab"
                cp "$AAB_BUILD" dist/HeckleGolfSim.aab
              else
                echo "Notice: No .aab found directly after Godot export. Running Gradle bundleMonoRelease on the Godot-exported Android project..."
                cd android/build
                ./gradlew bundleMonoRelease \
                  -Pexport_package_name=com.hecklegolf.simulator \
                  -Pexport_version_name="${{ steps.meta.outputs.VERSION_NAME }}" \
                  -Pexport_version_code="${{ steps.meta.outputs.VERSION_CODE }}" \
                  -Pexport_version_min_sdk=30 \
                  -Pexport_version_target_sdk=36 \
                  -Pexport_format=aab \
                  -Pexport_edition=mono \
                  -Pexport_build_type=release \
                  -Pperform_signing=false
                cd ../..
                AAB_BUILD=$(find android/build -name "*.aab" | head -n 1)
                if [ -n "$AAB_BUILD" ]; then
                  echo "Found generated AAB after Gradle fallback: $AAB_BUILD, copying to dist/HeckleGolfSim.aab"
                  cp "$AAB_BUILD" dist/HeckleGolfSim.aab
                fi
              fi
            fi
          fi

          if [ ! -f "dist/HeckleGolfSim.aab" ]; then
            echo "ERROR: Failed to generate dist/HeckleGolfSim.aab!"
            exit 1
          fi

      - name: Validate AAB Package Integrity
        run: |
          echo "Validating AAB structure and game assets..."
          if ! unzip -l dist/HeckleGolfSim.aab | grep -E "(\.pck|/assets/)"; then
            echo "ERROR: AAB bundle does not contain Godot project assets or pack files! Aborting."
            exit 1
          fi
          echo "AAB integrity check passed successfully."

      - name: Sign Android App Bundle with Jarsigner
        run: |
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            dist/HeckleGolfSim.aab "${{ secrets.ANDROID_KEY_ALIAS }}"

          jarsigner -verify dist/HeckleGolfSim.aab
          echo "AAB successfully signed and verified."

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeckleGolfSim-Android
          path: dist/HeckleGolfSim.aab

  # =========================================================================
  # 5. PUBLISH RELEASE & DEPLOY TO GOOGLE PLAY
  # =========================================================================
  release-and-deploy:
    name: Publish Release & Deploy Tracks
    needs: [build-windows, build-macos, build-ios, build-android]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download all build artifacts from current run
        if: ${{ !inputs.skip_builds && (!inputs.skip_windows || !inputs.skip_macos || !inputs.skip_ios || !inputs.skip_android) }}
        uses: actions/download-artifact@v4
        with:
          path: current_run_artifacts
        continue-on-error: true

      - name: Download build artifacts from previous run or latest release
        if: ${{ inputs.skip_builds || inputs.skip_windows || inputs.skip_macos || inputs.skip_ios || inputs.skip_android }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous_artifacts
          mkdir -p release_fallback_artifacts
          if [ -n "${{ inputs.from_run_id }}" ]; then
            IFS=',' read -ra RUN_IDS <<< "${{ inputs.from_run_id }}"
            for RUN_ID in "${RUN_IDS[@]}"; do
              TRIMMED_ID=$(echo "$RUN_ID" | xargs)
              if [ -n "$TRIMMED_ID" ]; then
                echo "Downloading artifacts from run $TRIMMED_ID..."
                gh run download "$TRIMMED_ID" --dir previous_artifacts || echo "Warning: gh run download failed for run $TRIMMED_ID"
              fi
            done
          fi
          # Also download latest release assets as fallback for any still-missing assets
          LATEST_TAG=$(gh release list -L 5 --json tagName -q '.[0].tagName')
          if [ -n "$LATEST_TAG" ]; then
            echo "Checking/downloading latest release ($LATEST_TAG) assets as fallback..."
            gh release download "$LATEST_TAG" --dir release_fallback_artifacts --clobber=false || true
          fi
          echo "Previous run artifacts (from specified run IDs):"
          find previous_artifacts -type f
          echo "Release fallback assets (from GitHub releases):"
          find release_fallback_artifacts -type f

      - name: Assemble Release Assets
        run: |
          python3 - << 'EOF'
          import os
          import shutil

          os.makedirs("dist", exist_ok=True)

          def find_files(base_dir, patterns):
              matches = []
              if not os.path.isdir(base_dir):
                  return matches
              for root, _, files in os.walk(base_dir):
                  for f in sorted(files):
                      if all(p.lower() in f.lower() for p in patterns):
                          matches.append(os.path.join(root, f))
              return matches

          targets = [
              ("Windows Desktop", ["windows", ".zip"]),
              ("macOS Universal", ["macos", ".zip"]),
              ("iOS Package",     [".ipa"]),
              ("Android AAB",     [".aab"])
          ]

          print("=== Assembling Release Assets ===")
          manifest = {}

          for platform_name, patterns in targets:
              # 1. Prefer current run artifacts
              curr = find_files("current_run_artifacts", patterns)
              if curr:
                  src = curr[0]
                  dst = os.path.join("dist", os.path.basename(src))
                  shutil.copy2(src, dst)
                  manifest[platform_name] = f"{os.path.basename(dst)} (Built in this run)"
                  continue

              # 2. Prefer previous run artifacts (from specified from_run_id)
              prev = find_files("previous_artifacts", patterns)
              if prev:
                  src = prev[0]
                  dst = os.path.join("dist", os.path.basename(src))
                  shutil.copy2(src, dst)
                  manifest[platform_name] = f"{os.path.basename(dst)} (Reused from run artifact: {src})"
                  continue

              # 3. Fall back to previous published release assets
              rel = find_files("release_fallback_artifacts", patterns)
              if rel:
                  src = rel[0]
                  dst = os.path.join("dist", os.path.basename(src))
                  shutil.copy2(src, dst)
                  manifest[platform_name] = f"{os.path.basename(dst)} (Reused from release: {src})"
              else:
                  manifest[platform_name] = "NOT FOUND"

          # Also copy any cached geometry tar if present
          for src in (find_files("current_run_artifacts", ["cached_geometry.tar"]) +
                      find_files("previous_artifacts", ["cached_geometry.tar"]) +
                      find_files("release_fallback_artifacts", ["cached_geometry.tar"])):
              dst = os.path.join("dist", os.path.basename(src))
              if not os.path.exists(dst):
                  shutil.copy2(src, dst)

          print("\n=== Release Artifact Manifest ===")
          for plat, info in manifest.items():
              print(f"  {plat:16s}: {info}")

          print("\n=== Assembled dist/ Directory Contents ===")
          for f in sorted(os.listdir("dist")):
              path = os.path.join("dist", f)
              size_mb = os.path.getsize(path) / (1024 * 1024)
              print(f"  {f} ({size_mb:.2f} MB)")
          EOF

      - name: Determine Release Tag
        id: release_info
        run: |
          PROJECT_VER=$(grep 'config/version=' project.godot | cut -d'"' -f2)
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v$PROJECT_VER"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "PROJECT_VER=$PROJECT_VER" >> $GITHUB_OUTPUT

      - name: Prepare Release Notes
        id: release_notes
        run: |
          python3 - << 'EOF'
          import os

          changes_file = "CHANGES_SINCE_LAST_RELEASE.md"
          raw_text = ""
          if os.path.exists(changes_file):
              with open(changes_file, "r", encoding="utf-8") as f:
                  raw_text = f.read().strip()

          # Filter out markdown comments or blank lines
          meaningful_lines = [
              line.strip() for line in raw_text.splitlines()
              if line.strip() and not line.strip().startswith("<!--")
          ]

          if meaningful_lines:
              release_notes = raw_text + "\n"
          else:
              release_notes = "Backend system improvements/code cleanup. No user facing changes.\n"

          # Write out release notes for GitHub Release
          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write(release_notes)

          # Prepare Google Play release notes (max 500 characters)
          os.makedirs("distribution/whatsnew", exist_ok=True)
          play_text = release_notes.strip().replace("\r\n", "\n")

          # Google Play strictly limits release notes to 500 characters (UTF-16 code units).
          # Ellipsis occupies 3 characters. Ensure no trailing newline is written to avoid +1 character length.
          max_len = 500
          def utf16_len(text: str) -> int:
              return len(text.encode("utf-16-le")) // 2

          if utf16_len(play_text) > max_len:
              target_len = max_len - 3
              while utf16_len(play_text) > target_len:
                  play_text = play_text[:-1]
              play_text = play_text.rstrip() + "..."

          with open("distribution/whatsnew/whatsnew-en-US", "w", encoding="utf-8", newline="\n") as f:
              f.write(play_text)

          print(f"=== Prepared Release Notes (Play Store length: {utf16_len(play_text)} chars) ===")
          print(release_notes)
          EOF

      - name: Create or Update GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.TAG }}
          name: Heckle Golf Simulator ${{ steps.release_info.outputs.TAG }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Check AAB for Play Store Deploy
        id: check_aab
        run: |
          # Deploy to Google Play if dist/HeckleGolfSim.aab was built in the CURRENT run,
          # OR if it was fetched from a specified previous run ID (from_run_id).
          # Only skip if it was reused from an already-published release fallback.
          IS_FRESH_ARTIFACT=false
          if [ -d "current_run_artifacts" ] && find current_run_artifacts -name "*.aab" | grep -q .; then
            IS_FRESH_ARTIFACT=true
            echo "AAB detected from current run build."
          elif [ -n "${{ inputs.from_run_id }}" ] && [ -d "previous_artifacts" ] && find previous_artifacts -name "*.aab" | grep -q .; then
            IS_FRESH_ARTIFACT=true
            echo "AAB detected from specified run ID (${{ inputs.from_run_id }})."
          fi

          if [ -f "dist/HeckleGolfSim.aab" ]; then
            if [ "$IS_FRESH_ARTIFACT" = "true" ]; then
              echo "has_aab=true" >> $GITHUB_OUTPUT
              echo "AAB found: dist/HeckleGolfSim.aab is ready for Google Play deployment."
            else
              echo "has_aab=false" >> $GITHUB_OUTPUT
              echo "Notice: dist/HeckleGolfSim.aab was reused from an already-published release. Skipping Google Play deployment to avoid duplicate version code error."
            fi
          else
            echo "has_aab=false" >> $GITHUB_OUTPUT
            echo "Notice: dist/HeckleGolfSim.aab not found, Google Play deployment step will be skipped."
          fi

      - name: Setup Play Store Service Account
        if: ${{ inputs.deploy_play_store && env.HAVE_PLAY_KEY == 'true' && steps.check_aab.outputs.has_aab == 'true' }}
        env:
          HAVE_PLAY_KEY: ${{ secrets.PLAY_STORE_JSON_KEY != '' }}
          PLAY_KEY_DATA: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          printf '%s\n' "$PLAY_KEY_DATA" > service_account.json
          # Validate JSON format before proceeding
          python3 -c "import json; json.load(open('service_account.json'))"

      # Deploy draft release to Open (Beta) and Closed (Alpha) tracks simultaneously
      - name: Deploy to Google Play (Beta & Alpha Tracks - Draft)
        if: ${{ inputs.deploy_play_store && env.HAVE_PLAY_KEY == 'true' && steps.check_aab.outputs.has_aab == 'true' }}
        env:
          HAVE_PLAY_KEY: ${{ secrets.PLAY_STORE_JSON_KEY != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service_account.json
          packageName: com.hecklegolf.simulator
          releaseFiles: dist/HeckleGolfSim.aab
          track: beta
          status: draft
          whatsNewDirectory: distribution/whatsnew

      - name: Clear Changes File for Next Release
        if: success()
        run: |
          CHANGES_FILE="CHANGES_SINCE_LAST_RELEASE.md"
          if [ -f "$CHANGES_FILE" ]; then
            if [ -s "$CHANGES_FILE" ]; then
              echo "Clearing $CHANGES_FILE for next release cycle..."
              : > "$CHANGES_FILE"

              if [ "${{ github.ref_type }}" = "branch" ]; then
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add "$CHANGES_FILE"
                if ! git diff --cached --quiet; then
                  git commit -m "chore: clear $CHANGES_FILE for next release cycle [skip ci]"
                  git pull --rebase origin "${{ github.ref_name }}" || true
                  git push origin "HEAD:${{ github.ref_name }}"
                  echo "Successfully pushed cleared $CHANGES_FILE to ${{ github.ref_name }}."
                fi
              else
                echo "Release triggered from non-branch ref (${{ github.ref }}), skipping commit."
              fi
            else
              echo "$CHANGES_FILE is already empty; no clearing or commit required."
            fi
          else
            echo "$CHANGES_FILE does not exist; skipping."
          fi
