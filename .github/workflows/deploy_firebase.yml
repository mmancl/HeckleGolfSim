name: Deploy Firebase & Hosting

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'database.rules.json'
      - 'functions/**'
      - 'firebase.json'
  workflow_dispatch:
    inputs:
      targets:
        description: 'Component(s) to deploy'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'hosting'
          - 'firestore:rules'
          - 'firestore'
          - 'database'
          - 'functions'
      dry_run:
        description: 'Dry run / validation only (skips live publishing)'
        required: false
        type: boolean
        default: false
      message:
        description: 'Deployment release message / commit note'
        required: false
        type: string
        default: 'Manual deploy via GitHub Actions'

permissions:
  contents: read

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            functions/package-lock.json
            firebase/tests/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase Tools CLI
        run: npm install -g firebase-tools

      - name: Install Functions Dependencies
        run: |
          if [ -f "functions/package-lock.json" ]; then
            npm --prefix functions ci
          else
            npm --prefix functions install
          fi

      - name: Install Test Dependencies
        run: |
          if [ -f "firebase/tests/package-lock.json" ]; then
            npm --prefix firebase/tests ci
          else
            npm --prefix firebase/tests install
          fi

      - name: Run Firebase Rules & Budget Function Unit Tests
        run: npm --prefix firebase/tests test

      - name: Setup Firebase Authentication
        id: auth
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HECKLE_GOLF_SIM || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Found Firebase Service Account secret. Configuring credentials..."
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase_sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase_sa.json" >> $GITHUB_ENV
            echo "AUTH_MODE=Service Account" >> $GITHUB_ENV
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "Found FIREBASE_TOKEN secret. Configuring Firebase CI token..."
            echo "FIREBASE_TOKEN=$FIREBASE_TOKEN" >> $GITHUB_ENV
            echo "AUTH_MODE=CI Token" >> $GITHUB_ENV
          else
            echo "::error::No Firebase authentication credentials found!"
            echo "Please configure either:"
            echo "  1) FIREBASE_SERVICE_ACCOUNT_HECKLE_GOLF_SIM (or FIREBASE_SERVICE_ACCOUNT) with your Service Account JSON key, or"
            echo "  2) FIREBASE_TOKEN with a CI token from 'firebase login:ci'"
            echo "in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Ensure GCP APIs & Pub/Sub Topic + $10 Budget Exist
        if: ${{ env.AUTH_MODE == 'Service Account' }}
        env:
          GCP_BILLING_ACCOUNT_ID: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
        run: |
          if command -v gcloud &> /dev/null; then
            echo "Activating GCP service account credentials..."
            gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase_sa.json" --project=heckle-golf-sim || true
            echo "Ensuring pubsub topic budget-alerts exists..."
            gcloud pubsub topics create budget-alerts --project=heckle-golf-sim || true
            if [ -n "$GCP_BILLING_ACCOUNT_ID" ]; then
              echo "Ensuring $10/month billing budget exists..."
              gcloud billing budgets create \
                --billing-account="$GCP_BILLING_ACCOUNT_ID" \
                --display-name="HeckleGolf-10USD-Monthly-Cap" \
                --budget-amount=10.00USD \
                --threshold-rule=percent=0.5 \
                --threshold-rule=percent=0.8 \
                --threshold-rule=percent=0.95 \
                --threshold-rule=percent=1.0 \
                --notifications-rule-pubsub-topic="projects/heckle-golf-sim/topics/budget-alerts" || true
            fi
          fi

      - name: Seed Initial system/status Doc (if not present)
        if: ${{ env.AUTH_MODE == 'Service Account' && inputs.dry_run != true }}
        run: |
          node -e "
            const admin = require('./functions/node_modules/firebase-admin');
            admin.initializeApp({
              projectId: 'heckle-golf-sim',
              databaseURL: 'https://heckle-golf-sim-default-rtdb.firebaseio.com'
            });
            async function seed() {
              const db = admin.firestore();
              const rtdb = admin.database();
              const statusRef = db.doc('system/status');
              const snap = await statusRef.get();
              if (!snap.exists) {
                const payload = {
                  schema_version: 1,
                  paused: false,
                  reason: '',
                  paused_month: '',
                  updated_at: Math.floor(Date.now() / 1000),
                  message: 'Multiplayer is temporarily paused for the remainder of the month as the developer\'s monthly budget has been reached, sorry for the inconvenience.'
                };
                await statusRef.set(payload);
                await rtdb.ref('system/status').set(payload);
                console.log('Seeded initial system/status doc in Firestore and RTDB');
              } else {
                console.log('system/status already exists');
              }
            }
            seed().catch(err => {
              console.warn('Seeding note:', err.message);
            });
          " || true

      - name: Validate Firebase Project Config
        run: |
          echo "Checking Firebase CLI version..."
          firebase --version
          
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "=== DRY RUN MODE ==="
            echo "Validating Firestore rules syntax..."
            if [ -f "firestore.rules" ]; then
              cat firestore.rules
            fi
            echo "Hosting directory contents:"
            ls -la web/
            echo "Dry run validation complete. No changes were deployed."
          fi

      - name: Deploy to Firebase
        if: ${{ inputs.dry_run != true }}
        run: |
          DEPLOY_ARGS=(--project heckle-golf-sim)
          TARGET="${{ inputs.targets || 'all' }}"
          
          if [ "$TARGET" != "all" ]; then
            DEPLOY_ARGS+=(--only "$TARGET")
          fi
          
          MESSAGE="${{ inputs.message }}"
          if [ -z "$MESSAGE" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              MESSAGE="Automated deploy from commit ${{ github.sha }}"
            else
              MESSAGE="Manual deploy via GitHub Actions"
            fi
          fi
          DEPLOY_ARGS+=(-m "$MESSAGE")
          
          echo "Executing: firebase deploy ${DEPLOY_ARGS[*]}"
          firebase deploy "${DEPLOY_ARGS[@]}"

      - name: Generate Deployment Summary
        if: always()
        run: |
          echo "### Firebase Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status == 'success' && 'Succeeded' || 'Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Project:** \`heckle-golf-sim\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target(s):** \`${{ inputs.targets || 'all' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run:** \`${{ inputs.dry_run || false }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Auth Mode:** \`${{ env.AUTH_MODE || 'Not authenticated' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Message:** ${{ inputs.message || (github.event_name == 'push' && format('Automated deploy from commit {0}', github.sha) || 'Manual deploy via GitHub Actions') }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Live Links" >> $GITHUB_STEP_SUMMARY
          echo "- [Hosting Site (web.app)](https://heckle-golf-sim.web.app)" >> $GITHUB_STEP_SUMMARY
          echo "- [Hosting Site (firebaseapp.com)](https://heckle-golf-sim.firebaseapp.com)" >> $GITHUB_STEP_SUMMARY
          echo "- [Firebase Console](https://console.firebase.google.com/project/heckle-golf-sim/overview)" >> $GITHUB_STEP_SUMMARY
